<!doctype html><html><head><title>Apply (inline errors)</title></head><body>
<form id="f" novalidate>
  <div class="field"><label for="n">Full name *</label><input id="n" name="name"><span class="field-error" id="n-err"></span></div>
  <div class="field"><label for="m">Email *</label><input id="m" name="email" type="email"><div role="alert" id="m-err"></div></div>
  <div class="field">Cover letter <textarea id="c" name="cover"></textarea><small class="hint-live" aria-live="polite" id="c-count"></small></div>
  <button type="submit">Submit application</button>
</form>
<script>
document.getElementById("f").onsubmit = function (e) {
  e.preventDefault();
  if (!n.value) document.getElementById("n-err").textContent = "This field is required";
  if (!m.value) { document.getElementById("m-err").textContent = "Please enter a valid email"; m.setAttribute("aria-invalid", "true"); }
  document.getElementById("c-count").textContent = c.value.length + " / 2000 characters";
};
</script></body></html>
